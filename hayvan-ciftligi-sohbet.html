<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hayvan Çiftliği Sohbet - KUTİY</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="hayvan-ciftligi-sohbet.css">
</head>
<body>
    <!-- Karakter Seçici -->
    <div class="character-selector" id="characterSelector">
        <div class="selector-header">
            <h2>Karakter Seçin</h2>
            <button class="close-selector" id="closeSelector">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="character-grid">
            <div class="character-card" data-character="napoleon">
                <div class="character-avatar">
                    <i class="fas fa-piggy-bank"></i>
                </div>
                <div class="character-info">
                    <h4>Napoleon</h4>
                </div>
            </div>
            <div class="character-card" data-character="snowball">
                <div class="character-avatar">
                    <i class="fas fa-lightbulb"></i>
                </div>
                <div class="character-info">
                    <h4>Snowball</h4>
                </div>
            </div>
            <div class="character-card" data-character="boxer">
                <div class="character-avatar">
                    <i class="fas fa-horse"></i>
                </div>
                <div class="character-info">
                    <h4>Boxer</h4>
                </div>
            </div>
            <div class="character-card" data-character="squealer">
                <div class="character-avatar">
                    <i class="fas fa-bullhorn"></i>
                </div>
                <div class="character-info">
                    <h4>Squealer</h4>
                </div>
            </div>
            <div class="character-card" data-character="clover">
                <div class="character-avatar">
                    <i class="fas fa-heart"></i>
                </div>
                <div class="character-info">
                    <h4>Clover</h4>
                </div>
            </div>
            <div class="character-card" data-character="molly">
                <div class="character-avatar">
                    <i class="fas fa-gem"></i>
                </div>
                <div class="character-info">
                    <h4>Molly</h4>
                </div>
            </div>
            <div class="character-card" data-character="benjamin">
                <div class="character-avatar">
                    <i class="fas fa-donkey"></i>
                </div>
                <div class="character-info">
                    <h4>Benjamin</h4>
                </div>
            </div>
            <div class="character-card" data-character="moses">
                <div class="character-avatar">
                    <i class="fas fa-crow"></i>
                </div>
                <div class="character-info">
                    <h4>Moses</h4>
                </div>
            </div>
            <div class="character-card" data-character="mrjones">
                <div class="character-avatar">
                    <i class="fas fa-user-tie"></i>
                </div>
                <div class="character-info">
                    <h4>Mr. Jones</h4>
                </div>
            </div>
            <div class="character-card" data-character="koyunlar">
                <div class="character-avatar">
                    <i class="fas fa-sheep"></i>
                </div>
                <div class="character-info">
                    <h4>Koyunlar</h4>
                </div>
            </div>
            <div class="character-card" data-character="kopekler">
                <div class="character-avatar">
                    <i class="fas fa-dog"></i>
                </div>
                <div class="character-info">
                    <h4>Köpekler</h4>
                </div>
            </div>
        </div>
    </div>

    <!-- Basit Chat Arayüzü -->
    <div class="chat-interface">
        <!-- Basit Header -->
        <div class="simple-header">
            <button class="character-select-btn" id="characterSelectBtn">
                <i class="fas fa-users"></i>
            </button>
            <div class="selected-character-info" id="selectedCharacterInfo">
                <span>Karakter Seçin</span>
            </div>
            <a href="hayvan-ciftligi-chatbot.html" class="back-btn">
                <i class="fas fa-arrow-left"></i>
            </a>
        </div>

        <!-- Chat Container -->
        <div class="chat-container" id="chatMessages">
            <div class="message received">
                Merhaba! Hayvan Çiftliği'nin karakterleriyle tanışmaya hazır mısın? Sol üstteki butona tıklayarak bir karakter seç ve onunla sohbet etmeye başla!
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <textarea id="chatInput" placeholder="Mesaj yaz..." rows="1" disabled></textarea>
            <button id="sendButton" onclick="sendMessage()" disabled>➤</button>
        </div>
    </div>

    <script src="https://js.puter.com/v2/"></script>
    <script src="hayvan-ciftligi-sohbet.js"></script>
</body>
</html>
